apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zestora-ingress
  namespace: zestora
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: zestora-backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zestora-frontend
                port:
                  number: 80
