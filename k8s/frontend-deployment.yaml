apiVersion: apps/v1
kind: Deployment
metadata:
  name: zestora-frontend
  namespace: zestora
  labels:
    app: zestora-frontend
    tier: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: zestora-frontend
  template:
    metadata:
      labels:
        app: zestora-frontend
        tier: web
    spec:
      containers:
        - name: frontend
          image: 440744216744.dkr.ecr.us-east-1.amazonaws.com/zestora/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: zestora-frontend
  namespace: zestora
  labels:
    app: zestora-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      name: http
  selector:
    app: zestora-frontend
