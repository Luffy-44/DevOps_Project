apiVersion: v1
kind: Service
metadata:
  name: zestora-mongo
  namespace: zestora
  labels:
    app: zestora-mongo
spec:
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
  clusterIP: None
  selector:
    app: zestora-mongo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zestora-mongo
  namespace: zestora
  labels:
    app: zestora-mongo
spec:
  serviceName: "zestora-mongo"
  replicas: 1
  selector:
    matchLabels:
      app: zestora-mongo
  template:
    metadata:
      labels:
        app: zestora-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
              name: mongodb
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 5Gi

