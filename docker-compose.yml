name: AWS_Project

# ─────────────────────────────────────────────────────────────────────────────
#  Zestora – Online Food Ordering System
#  Services: frontend • backend • mongo • prometheus • grafana • jenkins
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: zestora_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: zestora
    volumes:
      - mongo_data:/data/db
      - ./database/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - zestora_net
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Flask Backend ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zestora_backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/zestora
      JWT_SECRET: ${JWT_SECRET:-zestora_change_me_in_production}
      FLASK_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - zestora_net
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── React Frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000
    container_name: zestora_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - zestora_net

  # ─── Prometheus Monitoring ──────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: zestora_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - zestora_net

  # ─── Grafana Observability Dashboards ───────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: zestora_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    networks:
      - zestora_net

  # ─── Jenkins CI/CD Automation Server ────────────────────────────────────────
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: zestora_jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - zestora_net

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  mongo_data:
    name: aws_project_mongo_data
    external: true
  prometheus_data:
    name: aws_project_prometheus_data
    external: true
  grafana_data:
    name: aws_project_grafana_data
    external: true
  jenkins_home:
    name: jenkins_jenkins_home
    external: true

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  zestora_net:
    driver: bridge
